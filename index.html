<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Encomendas</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#202124}
header{background:#1f2937;color:white;padding:20px} header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;color:#cbd5e1}.container{max-width:1100px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{margin-top:0;font-size:19px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:7px;font-size:15px}
button{border:0;border-radius:7px;padding:11px 16px;font-weight:bold;cursor:pointer}
.btn-primary{background:#1f2937;color:white}.btn-delete{background:#fee2e2;color:#991b1b;padding:7px 10px}
.actions{margin-top:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e5e7eb;font-size:14px}th{background:#f9fafb}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e5e7eb;font-size:12px}
.pago{background:#dcfce7;color:#166534}.nao-pago{background:#fee2e2;color:#991b1b}
.empty{text-align:center;color:#6b7280;padding:25px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}header h1{font-size:21px}}
</style>
</head>
<body>
<header><h1>Gestão de Encomendas</h1><p>Registo e acompanhamento de encomendas</p></header>
<div class="container">
<div class="card"><h2>Nova encomenda</h2><div class="form-grid">
<div><label>Data</label><input type="date" id="data"></div>
<div><label>Nome do Cliente</label><input type="text" id="cliente" placeholder="Nome do cliente"></div>
<div><label>Produto</label><input type="text" id="produto" placeholder="Nome do produto"></div>
<div><label>Estado do processamento</label><select id="estado"><option>Pendente</option><option>Em processamento</option><option>Concluída</option><option>Enviada</option></select></div>
<div><label>Pago</label><select id="pago" onchange="controlarPagamento()"><option value="Não">Não</option><option value="Sim">Sim</option></select></div>
<div><label>Data de pagamento</label><input type="date" id="dataPagamento"></div>
</div><div class="actions"><button class="btn-primary" onclick="guardarEncomenda()">Guardar encomenda</button></div></div>
<div class="card"><h2>Encomendas</h2><div class="table-wrap"><table><thead><tr>
<th>Data</th><th>Cliente</th><th>Produto</th><th>Estado</th><th>Pago</th><th>Pagamento</th><th></th>
</tr></thead><tbody id="lista"></tbody></table></div><div id="semDados" class="empty">Ainda não existem encomendas.</div></div>
</div>
<script>
let encomendas=JSON.parse(localStorage.getItem("encomendas"))||[];
document.getElementById("data").value=new Date().toISOString().split("T")[0];
function controlarPagamento(){const pago=document.getElementById("pago").value;const campo=document.getElementById("dataPagamento");if(pago==="Sim"&&!campo.value)campo.value=new Date().toISOString().split("T")[0];if(pago==="Não")campo.value=""}
function guardarEncomenda(){const data=document.getElementById("data").value;const cliente=document.getElementById("cliente").value.trim();const produto=document.getElementById("produto").value.trim();const estado=document.getElementById("estado").value;const pago=document.getElementById("pago").value;const dataPagamento=document.getElementById("dataPagamento").value;if(!data||!cliente||!produto){alert("Preenche a data, cliente e produto.");return}encomendas.unshift({id:Date.now(),data,cliente,produto,estado,pago,dataPagamento});localStorage.setItem("encomendas",JSON.stringify(encomendas));document.getElementById("cliente").value="";document.getElementById("produto").value="";document.getElementById("estado").value="Pendente";document.getElementById("pago").value="Não";document.getElementById("dataPagamento").value="";mostrarEncomendas()}
function eliminarEncomenda(id){if(!confirm("Eliminar esta encomenda?"))return;encomendas=encomendas.filter(e=>e.id!==id);localStorage.setItem("encomendas",JSON.stringify(encomendas));mostrarEncomendas()}
function formatarData(data){if(!data)return"—";const p=data.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function mostrarEncomendas(){const lista=document.getElementById("lista");const semDados=document.getElementById("semDados");lista.innerHTML="";if(encomendas.length===0){semDados.style.display="block";return}semDados.style.display="none";encomendas.forEach(e=>{const linha=document.createElement("tr");linha.innerHTML=`<td>${formatarData(e.data)}</td><td>${e.cliente}</td><td>${e.produto}</td><td><span class="badge">${e.estado}</span></td><td><span class="badge ${e.pago==="Sim"?"pago":"nao-pago"}">${e.pago}</span></td><td>${formatarData(e.dataPagamento)}</td><td><button class="btn-delete" onclick="eliminarEncomenda(${e.id})">Eliminar</button></td>`;lista.appendChild(linha)})}
mostrarEncomendas();
</script>
</body>
</html>
